version: "3.7"

services:
  app_proxy:
    environment:
      # The format here is: <app-id>_<docker-service-name>_1
      APP_HOST: castell-sites_web_1
      APP_PORT: 3000

  web:
    image: ghcr.io/galetaire/castell:0.2.3
    restart: on-failure
    environment:
      - TZ=Etc/UTC
      # Only accept connections routed by Umbrel (see docker/web/lib/source.js).
      # Older umbrelOS versions route through this app_proxy container.
      - CASTELL_PROXY_HOST=castell-sites_app_proxy_1
      # Where the web app reaches Caddy to check the certificate it serves
      - CASTELL_CADDY_HOST=castell-sites_caddy_1
      # The host port Caddy is published on below, shown in the router instructions
      - CASTELL_HOST_PORT=8443
    volumes:
      # Keys, certificates, site files and the Caddyfile
      - ${APP_DATA_DIR}/data:/castell

  caddy:
    image: caddy:2.10.2
    restart: on-failure
    ports:
      # umbrelOS uses host port 443 itself, so Caddy is published on 8443.
      # Forward external TCP 443 on your router to <Umbrel LAN IP>:8443.
      - "8443:443"
    volumes:
      - ${APP_DATA_DIR}/data:/castell:ro
      - ${APP_DATA_DIR}/caddy:/data
    entrypoint: ["/bin/sh", "-c"]
    # Wait for the web app to write the first Caddyfile, then reload whenever it changes
    command:
      - until [ -f /castell/Caddyfile ]; do sleep 1; done; exec caddy run --config /castell/Caddyfile --adapter caddyfile --watch
