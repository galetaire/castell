<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Castell</title>
  <link rel="icon" href="icon.jpeg" type="image/jpeg">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply a saved dark theme before the page draws, so it doesn't flash light first
    try {
      if (localStorage.getItem('castell-theme') === 'dark') document.documentElement.dataset.theme = 'dark';
    } catch (e) {}
  </script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#/">
      <img src="icon.jpeg" alt="" width="36" height="36">
      <span>
        <strong>Castell</strong>
        <small>Handshake websites, secured with DANE</small>
      </span>
    </a>
    <div class="top-actions">
      <span id="caddy-status" class="pill" hidden></span>
      <button type="button" id="theme-toggle" class="small"></button>
    </div>
  </header>
  <main id="app" aria-live="polite">
    <p class="muted">Loading…</p>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>
