name: Build Castell image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "castell-sites/umbrel-app.yml"
      - ".github/workflows/build-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      image: ${{ steps.ver.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          # Image tag = the Umbrel app version, so every app release gets its own image
          TAG=$(grep -oP '^version: "\K[^"]+' castell-sites/umbrel-app.yml)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/castell" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            # Native ARM runner for Raspberry Pi based Umbrels
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ${{ needs.resolve.outputs.image }}:${{ needs.resolve.outputs.tag }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  merge:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch tags
        run: |
          IMAGE="${{ needs.resolve.outputs.image }}"
          TAG="${{ needs.resolve.outputs.tag }}"
          docker buildx imagetools create \
            -t "$IMAGE:$TAG" \
            -t "$IMAGE:latest" \
            "$IMAGE:$TAG-amd64" \
            "$IMAGE:$TAG-arm64"
          docker buildx imagetools inspect "$IMAGE:$TAG"
